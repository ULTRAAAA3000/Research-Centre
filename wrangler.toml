name = "research-centre"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
GITHUB_REPO = "ULTRAAAA3000/Research-Centre"
GITHUB_BRANCH = "main"
KB_PATH = "kb"

# Хранилище избранного и последнего поискового запроса.
# Создать: npx wrangler kv namespace create KB_KV  → вставить выданный id ниже.
[[kv_namespaces]]
binding = "KB_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Секреты (задаются командой `npx wrangler secret put <NAME>`):
#   TELEGRAM_BOT_TOKEN  — токен от @BotFather
#   WEBHOOK_SECRET      — произвольная строка, проверяется в заголовке вебхука
#   GITHUB_TOKEN        — (опционально) токен для приватного репо / лимитов API
